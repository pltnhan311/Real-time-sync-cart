<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#064E57">
<title>Cart – Delivery Schedule Sync (UAT)</title>
<style>
:root{
  --primary:#064E57;
  --primary-2:#0B6B73;
  --teal-text:#0A5C66;
  --teal-border:#2F8F93;
  --teal-bg:#EAF7F7;
  --section:#E6EBEF;
  --sep:#E8ECEF;
  --danger:#E5484D;
  --danger-bg:#FDECEC;
  --warn-bg:#FFF8E7;
  --warn:#E07A00;
  --muted:#8A8F94;
  --text:#1F2328;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:Inter,Roboto,"Segoe UI",-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;
  color:var(--text);background:#D9E0E5;font-size:14px;
  display:flex;align-items:center;justify-content:center;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;text-align:inherit}
button:disabled{cursor:default}
input,textarea{font:inherit;color:inherit}
.phone{
  position:relative;width:390px;height:min(844px,calc(100vh - 32px));
  background:#fff;border-radius:28px;overflow:hidden;
  box-shadow:0 20px 60px rgba(0,0,0,.25);
}
@media (max-width:500px){
  body{background:#fff}
  .phone{width:100%;height:100vh;height:100dvh;border-radius:0;box-shadow:none}
}
#app,.screen{position:absolute;inset:0}
.screen{display:flex;flex-direction:column;background:#fff}
.top{flex:none;background:#fff;position:relative;z-index:2}
.scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;position:relative}
.scroll::-webkit-scrollbar{width:0;height:0}

/* App bar */
.appbar{height:56px;margin-top:26px;display:flex;align-items:center;justify-content:center;position:relative}
.appbar h1{font-size:18px;font-weight:700;letter-spacing:.1px}
.appbar .back{position:absolute;left:6px;top:8px;width:40px;height:40px;display:grid;place-items:center;color:#333}
.appbar .actions{position:absolute;right:10px;top:12px;display:flex;gap:12px}
.icon-btn{width:32px;height:32px;border-radius:5px;display:grid;place-items:center;color:#fff}
.icon-btn.red{background:var(--danger)}
.icon-btn.add{background:var(--primary)}
.icon-btn:disabled{background:#D2D2D2}
.icon-btn.red:disabled{background:#F2B8BA}

/* Cart header blocks */
.banner{background:var(--warn-bg);color:var(--warn);font-weight:600;padding:11px 12px;font-size:13.5px;line-height:1.38}
.cust{background:var(--teal-bg);padding:12px;font-size:13px;line-height:1.5}
.cust .k{color:#8A9196}
.cust b{font-weight:700;color:#222}

/* Product (cart) */
.prod{padding:12px 16px 16px;border-bottom:4px solid var(--sep)}
.prod-head{display:flex;align-items:center;gap:10px}
.trash{width:32px;height:32px;border-radius:5px;background:var(--danger-bg);color:var(--danger);display:grid;place-items:center;flex:none}
.img{width:65px;height:65px;border:1.5px solid #E4E4E4;border-radius:4px;display:grid;place-items:center;position:relative;flex:none;background:#fff}
.promo-corner{position:absolute;left:-5px;top:3px;width:26px;height:22px;background:#0E7C7B;border-radius:0 11px 11px 0;display:grid;place-items:center}
.promo-corner::after{content:"";position:absolute;left:0;bottom:-4px;border-top:4px solid #0A4F4E;border-left:5px solid transparent}
.pinfo{flex:1;min-width:0;align-self:flex-start;padding-top:2px}
.pname{font-size:15px;line-height:1.2;color:#222}
.pbrand{font-size:12.5px;color:#999;margin-top:5px}
.halal{display:inline-flex;align-items:center;gap:4px;margin-top:6px;padding:2px 7px 2px 4px;border:1px solid #CFE9E9;background:var(--teal-bg);border-radius:4px;color:var(--primary-2);font-size:13px;font-weight:500}
.indent{margin-left:42px}
.pack{margin-top:14px;border:1.5px solid #E6E6E6;border-radius:4px;padding:7px 8px;display:flex;align-items:center;gap:8px;color:var(--teal-text);font-size:13px;font-weight:500}
.pack svg{flex:none}
.uom-row{display:flex;justify-content:space-between;align-items:flex-start;padding:16px 0 4px;gap:8px}
.uom-sep{height:1px;background:#E2E5E8;margin-top:8px}
.uom-label{font-size:13px;color:#333}
.uom-price{font-size:15.5px;color:var(--teal-text);font-weight:500;margin-top:5px}
.uom-price s{color:#7B8A8C;font-size:13px;margin-left:4px;font-weight:400}
.uom-total{display:inline-block;margin-top:8px;background:var(--teal-bg);color:var(--teal-text);font-size:15px;font-weight:500;padding:4px 5px;border-radius:4px}
.uom-right{display:flex;flex-direction:column;align-items:center;flex:none}
.stepper{display:flex;gap:8px;align-items:center}
.st-btn{width:36px;height:36px;border-radius:4px;background:var(--primary);color:#fff;display:grid;place-items:center;flex:none}
.st-btn:disabled{background:#A7BCBF}
.st-input{width:48px;height:38px;border:1.2px solid #E2E2E2;border-radius:4px;text-align:center;font-size:17px;outline:none;background:#fff}
.st-input:focus{border-color:var(--teal-border)}
.unalloc{color:var(--warn);font-weight:700;font-size:13px;margin-top:8px;white-space:nowrap}
.disc{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;margin-top:12px}
.disc svg{flex:none}

/* Section */
.sec-head{background:var(--section);padding:14px 16px;font-weight:700;font-size:15.5px}
.sec-body{padding:12px 16px 20px}
.add-delivery{width:100%;height:46px;border-radius:6px;background:var(--teal-bg);display:flex;align-items:center;justify-content:center;gap:10px;font-size:16px;color:#222}
.sched-link{width:100%;display:flex;align-items:center;justify-content:space-between;padding:8px 0;color:var(--primary-2)}
.sched-link + .sched-link{border-top:1px solid #EEF1F3}
.sl-title{display:block;font-size:16px;font-weight:500}
.sl-sub{display:block;font-size:12px;color:var(--muted);margin-top:2px}

/* Footer + nav */
.footer{flex:none;padding:14px 16px 12px;background:#fff;box-shadow:0 -6px 14px rgba(0,0,0,.06);position:relative;z-index:2}
.total-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.t-label{font-size:14px}
.t-items{font-size:11.5px;color:var(--muted);margin-top:2px}
.t-val{font-size:20px;font-weight:600}
.btn-primary{width:100%;height:44px;border-radius:6px;background:var(--primary);color:#fff;font-size:16px;text-align:center;transition:background .2s}
.btn-primary:disabled{background:#E4E4E4;color:#fff}
.nav{flex:none;height:62px;background:#F6F6F6;display:flex}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#8B8B8B;font-size:12px;text-align:center}
.nav button.active{color:var(--primary)}
.nav .ic{position:relative;height:24px}
.badge{position:absolute;top:-6px;left:-6px;min-width:16px;height:16px;border-radius:8px;background:var(--primary);color:#fff;font-size:10px;display:grid;place-items:center;padding:0 3px;border:1.5px solid #F6F6F6}
.badge.bump{animation:bump .35s}
@keyframes bump{50%{transform:scale(1.35)}}

/* Empty */
.empty{padding:48px 24px;text-align:center;color:var(--muted)}
.empty .e-t{font-size:16px;color:#333;font-weight:600;margin-top:12px}
.empty .e-s{font-size:13px;margin-top:6px}

/* Schedule editor */
.gapbar{height:6px;background:var(--section)}
.field-wrap{padding:14px 16px 12px}
.flabel{font-size:15px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.flabel.mt{margin-top:18px}
.req{color:var(--danger);font-size:16px;margin-left:-4px;align-self:flex-start}
.select{width:100%;min-height:40px;border:1.5px solid var(--teal-border);border-radius:6px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;font-size:15px;text-align:left;background:#fff}
.select.disabled{background:#CFCFCF;border-color:#E2E2E2}
.select.date{background:var(--teal-bg)}
.select.invalid{border-color:var(--danger)}
.acc-head{background:var(--teal-bg);min-height:54px;padding:8px 16px;display:flex;align-items:center;justify-content:space-between;width:100%;font-size:16px;border-bottom:1px solid #DCE6E8;color:#222}
.acc-head + .acc-head{margin-top:0}
.acc-head .chev{color:var(--primary)}
.acc-sub{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.chip{display:inline-block;font-size:11px;padding:2px 7px;border-radius:10px;margin-left:8px;vertical-align:2px;font-weight:600}
.chip.warn{background:#FFEFD2;color:var(--warn)}
.chip.ok{background:#DDF3EA;color:#16835A}
.acc-body{padding:14px 16px 4px;border-bottom:1px solid #DCE6E8}
.addr-card{border:1.5px solid var(--teal-border);border-radius:6px;padding:10px;display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:#fff}
.addr-txt{flex:1;min-width:0}
.addr-name{font-weight:700;font-size:14px}
.addr-line{color:var(--teal-text);font-size:14px;margin-top:4px;line-height:1.35}
textarea.instr{width:100%;height:64px;border:1.2px solid #E2E2E2;border-radius:6px;padding:10px;font-size:14px;resize:none;outline:none}
textarea.instr:focus{border-color:var(--teal-border)}
.err{color:var(--danger);font-size:12px;margin-top:6px}
.sp{margin:18px -16px 0;padding:14px 16px 4px;border-top:4px solid var(--sep)}
.sp-head{display:flex;gap:12px;align-items:flex-start}
.reset{background:var(--teal-bg);color:var(--teal-text);padding:9px 14px;border-radius:5px;font-size:15px;flex:none}
.sp .pack{margin-top:12px}
.uom-box{border:1.5px solid #E6E6E6;border-radius:5px;padding:9px 8px 9px 10px;display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.uom-box .ul{font-size:15.5px}
.avail{font-size:13.5px;margin:8px 0 4px}
.avail b{color:var(--teal-text);font-weight:500}
.avail.zero b{color:var(--muted)}
.avail-note{font-size:12px;color:#1F6FB2;background:#EAF3FC;border-radius:4px;padding:5px 8px;margin:2px 0 6px;line-height:1.35}
.avail-note.over{color:var(--warn);background:#FFF4E2}
.uom-row.flash .uom-total,.uom-row.flash .st-input{animation:flash 2.2s ease-out}
@keyframes flash{0%,35%{background:#FFF1C7}}
.add-delivery.more{margin-top:12px;height:42px;font-size:15px}
.btn-outline{width:100%;height:44px;border:1.5px solid var(--teal-border);background:var(--teal-bg);color:var(--teal-text);border-radius:6px;font-size:16px;display:flex;align-items:center;justify-content:center;gap:6px}
.btn-outline:disabled{opacity:.6}
.save-wrap{margin:0 -16px;padding:14px 16px 16px;border-top:4px solid var(--sep)}
.ed-empty{padding:36px 24px;text-align:center;color:var(--muted);font-size:13.5px}

/* Order confirmation */
.oc-hero{margin:14px 16px 4px;padding:14px;border-radius:8px;background:var(--teal-bg);display:flex;align-items:center;justify-content:space-between}
.oc-id{font-size:16px}
.oc-id b{font-size:18px;color:var(--primary)}
.card{margin:12px 16px;border:1px solid #E3E8EC;border-radius:8px;overflow:hidden}
.card-h{padding:10px 12px;background:var(--section);font-weight:700;font-size:14px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 12px;font-size:13.5px;border-top:1px solid #F0F2F4}
.card-h + .kv{border-top:0}
.kv .k{color:var(--muted);flex:none}
.kv .v{text-align:right;font-weight:500}
.kv.total{font-size:16px;font-weight:700}
.kv.total .k{color:var(--text)}
.oc-sched{padding:10px 12px;border-top:1px solid #F0F2F4;font-size:13.5px;line-height:1.45}
.card-h + .oc-sched{border-top:0}
.oc-sched .t{font-weight:700;color:var(--primary-2);margin-bottom:2px}
.oc-sched .m{color:var(--muted)}
.oc-item{padding:10px 12px;border-top:1px solid #F0F2F4}
.card-h + .oc-item{border-top:0}
.oc-item .n{font-size:14px;font-weight:600}
.oc-item .r{display:flex;justify-content:space-between;font-size:13px;margin-top:5px;color:#444}
.oc-item .d{font-size:12.5px;color:var(--muted);margin-top:5px;display:flex;align-items:center;gap:6px}

/* Overlay: dialog / sheet / calendar */
#ov:empty{display:none}
#ov.still .ov-bg,#ov.still .dialog,#ov.still .sheet-box,#ov.still .cal{animation:none}
.ov{position:absolute;inset:0;z-index:50;display:flex;align-items:center;justify-content:center}
.ov.sheet{align-items:flex-end}
.ov-bg{position:absolute;inset:0;background:rgba(0,0,0,.45);animation:fade .15s}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.dialog{position:relative;width:78%;max-width:300px;max-height:80%;overflow:auto;background:#fff;border-radius:8px;padding:20px 20px 18px;animation:up .18s}
.dlg-t{font-size:16.5px;font-weight:700;margin-bottom:14px;text-align:center;color:#222}
.dlg-b{font-size:14px;line-height:1.5;color:#7A7F84}
.dlg-a{display:flex;flex-direction:column;gap:12px;margin-top:20px}
.dbtn{width:100%;height:42px;border-radius:5px;font-size:15px;text-align:center}
.dbtn.ghost{border:1px solid #D9DDE0;color:#6B7075;background:#fff}
.dbtn.primary{background:var(--primary);color:#fff}
.dbtn.danger{background:#EB5757;color:#fff}
.ua-line{padding-left:2px}

/* Results (Category) */
.search-row{display:flex;gap:10px;padding:10px 12px 12px}
.search{flex:1;min-width:0;height:44px;background:var(--teal-bg);border:1px solid #CFE6E6;border-radius:6px;display:flex;align-items:center;gap:8px;padding:0 12px;cursor:text}
.search input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:14px}
.search input::placeholder{color:#8A9196}
.filter-btn{width:44px;height:44px;border:1px solid #D9DDE0;border-radius:6px;display:grid;place-items:center;position:relative;flex:none;background:#fff}
.filter-btn .dot{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--danger)}
.rcard{padding:14px 16px 16px;border-top:8px solid var(--sep)}
.rhead{display:flex;gap:12px;align-items:flex-start}
.radd{width:40px;height:40px;border-radius:4px;background:var(--primary);color:#fff;display:grid;place-items:center;flex:none}
.rpack{display:flex;align-items:center;gap:6px;color:var(--teal-text);font-size:12.5px;font-weight:500;margin-top:12px}
.rpack svg{width:16px;height:16px;flex:none}
.rprice{margin-top:10px;border:1px solid #E3E6E8;border-radius:5px;display:grid;grid-template-columns:1fr 1fr;padding:10px 0}
.rprice > div{padding:0 10px;font-size:13.5px;white-space:nowrap}
.rprice > div + div{border-left:1px solid #E3E6E8}
.rprice b{color:var(--teal-text);font-weight:600}
.rprice s,.as-row s{color:#888;font-size:12px;margin-left:3px}
.incart{font-size:12px;color:#16835A;margin-top:8px;font-weight:600}
.r-empty{padding:48px 24px;text-align:center;color:var(--muted)}
.add-sheet .as-head{display:flex;gap:12px;padding:0 16px 12px;align-items:flex-start}
.as-pack{font-size:12px;color:var(--teal-text);margin-top:4px}
.as-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;border-top:1px solid #F0F2F4}
.as-row .l1{font-size:14.5px}
.as-row .l2{font-size:14px;color:var(--teal-text);margin-top:3px;font-weight:500}
.as-row .l3{font-size:11.5px;color:#16835A;margin-top:3px;font-weight:600}
.as-foot{padding:12px 16px 0}
.sheet-box{position:relative;width:100%;background:#fff;border-radius:14px 14px 0 0;padding:8px 0 18px;animation:up .2s}
.sheet-grip{width:40px;height:4px;border-radius:2px;background:#D5D9DD;margin:4px auto 10px}
.sheet-t{font-size:16px;font-weight:700;padding:4px 16px 8px}
.sheet-opt{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 16px;border-top:1px solid #F0F2F4;font-size:15px;text-align:left}
.sheet-opt .s{display:block;font-size:12.5px;color:var(--teal-text);margin-top:3px}
.sheet-opt.sel{color:var(--primary);font-weight:600}
.cal{position:relative;width:322px;max-width:92%;background:#fff;border-radius:10px;overflow:hidden;animation:up .18s}
.cal-h{background:var(--primary);color:#fff;padding:14px 18px}
.cal-h small{opacity:.8;font-size:11px;letter-spacing:1px;text-transform:uppercase}
.cal-h div{font-size:24px;font-weight:600;margin-top:6px}
.cal-nav{display:flex;align-items:center;justify-content:space-between;padding:10px 10px 2px}
.cal-nav b{font-size:14.5px}
.cal-nav button{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#333}
.cal-nav button:disabled{color:#CCC}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);padding:0 10px;row-gap:2px}
.cal-grid .wd{font-size:12px;color:var(--muted);text-align:center;padding:6px 0}
.day{height:38px;width:38px;border-radius:50%;margin:auto;font-size:13.5px;text-align:center}
.day:disabled{color:#C4C4C4}
.day.today{border:1px solid var(--primary)}
.day.sel{background:var(--primary);color:#fff}
.cal-act{display:flex;justify-content:flex-end;gap:6px;padding:8px 12px 12px}
.txt-btn{color:var(--primary-2);font-weight:600;padding:8px 14px;border-radius:4px;font-size:14px}
.txt-btn:disabled{color:#BBB}

/* Toast, loading, UAT */
.toast{position:absolute;left:50%;bottom:150px;transform:translateX(-50%);background:#263238;color:#fff;padding:10px 14px;border-radius:8px;font-size:13px;z-index:80;max-width:86%;opacity:0;transition:opacity .2s;pointer-events:none;text-align:center;line-height:1.4}
.toast.show{opacity:1}
.toast.success{background:#11695F}
.toast.error{background:#B3261E}
.loading{position:absolute;inset:0;z-index:90;background:rgba(255,255,255,.55);display:none;align-items:center;justify-content:center}
.loading.show{display:flex}
.spin-box{background:#fff;border-radius:12px;padding:18px 22px;box-shadow:0 6px 24px rgba(0,0,0,.15);display:flex;flex-direction:column;align-items:center;gap:10px;font-size:13px;color:#555}
.spinner{width:30px;height:30px;border:3px solid #D6E7E8;border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.uat{position:absolute;right:0;bottom:0;width:76px;height:76px;overflow:hidden;z-index:100;pointer-events:none}
.uat span{position:absolute;right:-34px;bottom:16px;width:140px;transform:rotate(-45deg);background:#2B2B2B;color:#fff;font-weight:800;font-size:13px;text-align:center;padding:6px 0;letter-spacing:.5px}
</style>
</head>
<body>
<div class="phone" id="phone">
  <div id="app"></div>
  <div id="ov"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="loading" id="loading"><div class="spin-box"><div class="spinner"></div><span id="loadingText">Loading...</span></div></div>
  <div class="uat"><span>UAT</span></div>
</div>

<script>
(function(){
'use strict';

/* ---------- Helpers ---------- */
var $ = function(s){ return document.querySelector(s); };
var pad = function(n){ return String(n).padStart(2,'0'); };
var iso = function(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); };
var parseIso = function(s){ var p=s.split('-').map(Number); return new Date(p[0],p[1]-1,p[2]); };
var fmtDate = function(s){ var d=parseIso(s); return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear(); };
var today = function(){ var d=new Date(); d.setHours(0,0,0,0); return d; };
var addDays = function(d,n){ var x=new Date(d); x.setDate(x.getDate()+n); return x; };
var esc = function(s){ return String(s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };
var money = function(c){ return (c<0?'-':'')+'$'+(Math.abs(c)/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); };
var ordinal = function(n){ var s=['th','st','nd','rd'], v=n%100; return n+(s[(v-20)%10]||s[v]||s[0]); };
var keyOf = function(pid,u){ return pid+':'+u; };

function burst(cx,cy,ro,ri,n){
  var p=[];
  for(var i=0;i<n*2;i++){ var r=i%2?ri:ro, a=Math.PI*i/n-Math.PI/2; p.push((cx+r*Math.cos(a)).toFixed(2)+','+(cy+r*Math.sin(a)).toFixed(2)); }
  return p.join(' ');
}

var STORE_KEY = 'rtsc-stock-status-demo-v1';
function fresh(){ return { cart:Object.assign({},INITIAL_CART), order:INITIAL_ORDER.slice(), incoterm:DEFAULT_INCOTERM, schedules:[], nextOrderId:2677, draftOrderId:null }; }

  try{ var s=JSON.parse(localStorage.getItem(STORE_KEY)); if(s && s.cart && Array.isArray(s.schedules)) return s; }catch(e){}
  return null;

/* Keep S.order in line with the cart: drop removed products, append newly added ones. */
function syncOrder(){
  if(!Array.isArray(S.order)) S.order=INITIAL_ORDER.slice();
  var has={};
  Object.keys(S.cart).forEach(function(k){ var p=k.split(':')[0]; if(PRODUCTS[p]) has[p]=1; else delete S.cart[k]; });
  S.order=S.order.filter(function(p){ return has[p]; });
  Object.keys(has).forEach(function(p){ if(S.order.indexOf(p)<0) S.order.push(p); });
}
function persist(){ syncOrder(); try{ localStorage.setItem(STORE_KEY, JSON.stringify(S)); }catch(e){} }

/* ---------- Domain logic ---------- */
function cartLines(){
  return S.order.map(function(pid){
    return { pid:pid, uoms:Object.keys(PRODUCTS[pid].uoms).filter(function(u){ return S.cart[keyOf(pid,u)]>0; }) };
  }).filter(function(l){ return l.uoms.length; });
}
function schedOrder(){
  var o=SCHED_BASE.filter(function(p){ return S.order.indexOf(p)>=0; });
  S.order.forEach(function(p){ if(o.indexOf(p)<0) o.push(p); });
  return o.map(function(p){ return [p, PRODUCTS[p].schedUoms || Object.keys(PRODUCTS[p].uoms)]; });
}
function productKeys(pid){ return Object.keys(PRODUCTS[pid].uoms).map(function(u){ return keyOf(pid,u); }); }
function allocated(k, list){
  return (list||S.schedules).reduce(function(a,s){ return a+(s.alloc[k]||0); },0);
}
function mismatches(){
  if(!S.schedules.length) return [];
  var out=[];
  cartLines().forEach(function(l){
    l.uoms.forEach(function(u){
      var k=keyOf(l.pid,u), c=S.cart[k], a=allocated(k);
      if(c!==a) out.push({ pid:l.pid, uom:u, key:k, cart:c, alloc:a, diff:c-a });
    });
  });
  return out;
}
function totals(cart){
  var gross=0, net=0, items=0;
  Object.keys(cart).forEach(function(k){
    var p=k.split(':'), pu=PRODUCTS[p[0]].uoms[p[1]], q=cart[k];
    items+=q; net+=pu.price*q; gross+=(pu.list||pu.price)*q;
  });
  var gst=Math.round(net*GST_RATE/100);
  return { gross:gross, disc:gross-net, net:net, gst:gst, total:net+gst, items:items };
}
function productDiscount(pid, cart){
  var p=PRODUCTS[pid], d=0;
  Object.keys(p.uoms).forEach(function(u){ var pu=p.uoms[u]; if(pu.list) d+=(pu.list-pu.price)*(cart[keyOf(pid,u)]||0); });
  return d;
}
function cleanupSchedules(){
  S.schedules.forEach(function(s){
    Object.keys(s.alloc).forEach(function(k){ if(!(S.cart[k]>0) || !s.alloc[k]) delete s.alloc[k]; });
  });
  S.schedules = S.schedules.filter(function(s){ return Object.keys(s.alloc).length; });
  if(!Object.keys(S.cart).length) S.schedules=[];
}
/* Cart quantity change. Reducing below the scheduled total asks first; on Confirm the
   schedule is kept as is and the line shows "Overallocated". */
function setCartQty(k, n){
  n = Math.max(1, Math.min(MAX_QTY, Math.floor(n)||1));
  var old=S.cart[k], a=allocated(k);
  if(n===old){ render(); return; }
  if(n<old && n<a){
    var pid=k.split(':')[0], u=k.split(':')[1];
    dialog('Reduce Cart Quantity?',
      'Reducing '+PRODUCTS[pid].name+' to '+n+' '+u+' will leave '+(a-n)+' '+u+' still scheduled.<br><br>Please update your delivery schedule.',
      [ { label:'Confirm', kind:'danger', fn:function(){ applyCartQty(k,n); } },
        { label:'Cancel', fn:function(){ render(); } } ], false);
    return;
  }
  applyCartQty(k,n);
}
function applyCartQty(k,n){ S.cart[k]=n; persist(); render(); }

/* ---------- Editor (Delivery Schedule screen) ---------- */
function snap(s){ return { id:s.id, addressIdx:s.addressIdx, date:s.date, instruction:s.instruction, alloc:Object.assign({},s.alloc) }; }
function newDraft(){ return { id:'s'+Date.now().toString(36)+Math.random().toString(36).slice(2,6), addressIdx:0, date:null, instruction:'', alloc:{}, committed:null, dirty:false, err:null }; }
function openEditor(expandIdx, addNew){
  // no saved schedule yet -> start from the default Incoterm (also covers data saved by older versions)
  E = { incoterm:S.schedules.length ? S.incoterm : DEFAULT_INCOTERM, expanded:expandIdx,
        list:S.schedules.map(function(s){ var d=snap(s); d.committed=snap(s); d.dirty=false; d.err=null; return d; }) };
  if(addNew || !E.list.length){ E.list.push(newDraft()); E.expanded=E.list.length-1; }
  go('schedule');
}
/* Commit saved schedules to the cart.
   Rule: schedule total > cart  -> cart is auto-increased, but only for the UOMs the user
                                   just raised in the schedule being saved (incKeys).
         schedule total < cart  -> cart is kept, the gap shows as "Unallocated".
   Lines that are already Overallocated (cart was reduced) stay untouched. */
function commitEditor(incKeys){
  S.incoterm = E.incoterm;
  S.schedules = E.list.filter(function(x){ return x.committed; }).map(function(x){ return snap(x.committed); });
  var increased=[];
  (incKeys||[]).forEach(function(k){
    var a=allocated(k);
    if(S.cart[k]>0 && a>S.cart[k]){ increased.push({ key:k, from:S.cart[k], to:a }); S.cart[k]=a; }
  });
  if(increased.length) UI.synced=(UI.synced||[]).concat(increased);
  cleanupSchedules(); persist();
  return increased;
}
function editorAllSaved(){ return E.list.every(function(x){ return x.committed && !x.dirty; }); }
function canAddSchedule(){ return E.list.length===0 || editorAllSaved(); }
function setAlloc(i,k,n){
  var it=E.list[i];
  n=Math.floor(n); if(isNaN(n)||n<0) n=0;
  if(n>MAX_QTY) n=MAX_QTY;
  it.alloc[k]=n; it.dirty=true; render();
}
function saveSched(i){
  var it=E.list[i];
  if(!it.date){ it.err='Please choose Delivery/Self-Pickup Date'; render(); toast('Please choose Delivery/Self-Pickup Date','error'); return; }
  var sum=Object.keys(it.alloc).reduce(function(a,k){ return a+(it.alloc[k]||0); },0);
  if(!sum){ toast('Please allocate at least 1 product to this schedule','error'); return; }
  loading(550,'Saving...').then(function(){
    it.err=null;
    var prev=(it.committed && it.committed.alloc) || {};
    var raised=Object.keys(it.alloc).filter(function(k){ return (it.alloc[k]||0) > (prev[k]||0); });
    Object.keys(it.alloc).forEach(function(k){ if(!it.alloc[k]) delete it.alloc[k]; });
    it.committed=snap(it); it.dirty=false;
    var inc=commitEditor(raised);
    render();
    toast(ordinal(i+1)+' Schedule saved successfully'+
      (inc.length ? '. Cart quantity increased for '+inc.length+' item'+(inc.length>1?'s':'')+' to match the schedule' : ''),'success');
  });
}
function refreshEditorButtons(i){
  var done=$('[data-act="done"]'); if(done) done.disabled=!editorAllSaved();
  var add=$('[data-act="addSched"]'); if(add) add.disabled=!canAddSchedule();
  var sv=$('[data-act="saveSched"][data-idx="'+i+'"]'); if(sv){ sv.disabled=false; sv.innerHTML='Save'; }
  var chip=$('[data-chip="'+i+'"]'); if(chip) chip.innerHTML='<span class="chip warn">Unsaved</span>';
}
function changeIncoterm(v){
  if(v===E.incoterm) return;
  loading(800,'Loading...').then(function(){
    E.incoterm=v;
    E.list.forEach(function(it){ it.addressIdx=0; it.dirty=true; });
    if(!E.list.length){ E.list.push(newDraft()); E.expanded=0; }
    render();
  });
}
function editorBack(){
  if(E.list.some(function(x){ return x.dirty; })){
    dialog('Discard Changes?','You have unsaved changes in the delivery schedule.<br><br>Leave without saving?',[
      { label:'Discard', kind:'danger', fn:function(){ E=null; go('cart'); } },
      { label:'Cancel' }
    ]);
  } else { E=null; go('cart'); }
}

/* ---------- Checkout ---------- */
function checkout(){
  var mm=mismatches();
  if(mm.length){ showUpdateCart(mm); return; }
  if(S.draftOrderId==null){ S.draftOrderId=S.nextOrderId; persist(); }
  loading(500,'Loading...').then(function(){ go('confirm'); });
}
/* One popup for both directions: "not assigned" (cart > schedule) and "overallocated"
   (schedule > cart). Update Cart sets every line to the scheduled quantity. */
function showUpdateCart(mm){
  var lines=mm.map(function(m){
    return '<div class="ua-line">• '+PRODUCTS[m.pid].name+': '+Math.abs(m.diff)+' '+m.uom+(m.diff>0?' not assigned':' overallocated')+'</div>';
  }).join('');
  dialog('Update Cart Quantity', 'The scheduled quantity doesn\'t match your cart.<br><br>'+lines, [
    { label:'Update Cart', kind:'danger', fn:updateCart },
    { label:'Cancel' }
  ]);
}
function updateCart(){
  loading(600,'Updating cart...').then(function(){
    Object.keys(S.cart).forEach(function(k){ var a=allocated(k); if(a>0) S.cart[k]=a; else delete S.cart[k]; });
    cleanupSchedules(); persist(); render(); bumpBadge();
    toast('Cart quantity updated to match the delivery schedule','success');
  });
}
function submitOrder(){
  loading(900,'Submitting order...').then(function(){
    var id=S.draftOrderId;
    S.cart={}; S.schedules=[]; S.incoterm=DEFAULT_INCOTERM; S.nextOrderId=id+1; S.draftOrderId=null;
    persist();
    dialog('Order Submitted','Order ID <b>'+id+'</b> has been submitted successfully.',[
      { label:'OK', kind:'primary', fn:function(){ go('cart'); } }
    ], false);
  });
}

function stepper(kind,k,v,min,max,idx){

    '<button class="st-btn" data-act="'+kind+'Step" data-key="'+k+'" data-d="1"'+ia+(v>=max?' disabled':'')+' aria-label="Increase">'+I.plus+'</button>'+

function cartProduct(l, mm, sync){
  var p=PRODUCTS[l.pid];
  var rows=l.uoms.map(function(u){
    var k=keyOf(l.pid,u), q=S.cart[k], pu=p.uoms[u], m=mm[k], sy=sync[k];

      '<div class="uom-price">'+money(pu.price)+(pu.list?' <s>'+money(pu.list)+'</s>':'')+'</div>'+

  var disc='';
  if(p.promo){ var d=productDiscount(l.pid,S.cart); if(d) disc='<div class="disc">'+I.discBlue+'<span data-discount="'+l.pid+'">'+p.promo.label+': '+money(-d)+'</span></div>'; }

function schedItem(it, i){
  var open = E.expanded===i;
  var unsaved = it.dirty || !it.committed;
  var sub = !open && it.date ? '<span class="acc-sub">'+fmtDate(it.date)+'</span>' : '';
  var h='<button class="acc-head" data-act="toggleAcc" data-idx="'+i+'"><span><span>'+ordinal(i+1)+' Schedule</span><span data-chip="'+i+'">'+
        (unsaved?'<span class="chip warn">Unsaved</span>':'')+'</span>'+sub+'</span>'+(open?I.chevU:I.chevD)+'</button>';
  if(!open) return h;
  var addrs=ADDR[E.incoterm], a=addrs[it.addressIdx]||addrs[0];
  h+='<div class="acc-body">'+
    '<div class="flabel">Incoterm</div><div class="select disabled">'+E.incoterm+'</div>'+
    '<div class="flabel mt">'+I.pin+'Address</div>'+
    '<button class="addr-card" data-act="pickAddr" data-idx="'+i+'"><div class="addr-txt"><div class="addr-name">'+esc(a.name)+'</div><div class="addr-line">'+esc(a.addr)+'</div></div>'+I.chevR+'</button>'+
    '<div class="flabel mt">'+I.cal+'Delivery/Self-Pickup Date <span class="req">*</span></div>'+
    '<button class="select date'+(it.err?' invalid':'')+'" data-act="pickDate" data-idx="'+i+'"><span id="dateVal'+i+'">'+(it.date?fmtDate(it.date):'Choose Date')+'</span>'+I.chevR+'</button>'+
    (it.err?'<div class="err">'+it.err+'</div>':'')+
    '<div class="flabel mt">Delivery Instruction</div>'+
    '<textarea class="instr" data-input="instr" data-idx="'+i+'" maxlength="250" placeholder="Enter Delivery Instruction">'+esc(it.instruction)+'</textarea>';
  schedOrder().forEach(function(x){
    var pid=x[0], p=PRODUCTS[pid];
    var us=x[1].filter(function(u){ return S.cart[keyOf(pid,u)]>0; });
    if(!us.length) return;
    h+='<div class="sp" data-sp="'+pid+'"><div class="sp-head">'+productImg({})+
       '<div class="pinfo"><div class="pname">'+p.name+'</div><div class="pbrand">Brand: '+p.brand+'</div></div>'+
       '<button class="reset" data-act="resetAlloc" data-idx="'+i+'" data-pid="'+pid+'">Reset</button></div>'+
       '<div class="pack">'+I.box+'<span>Pack Size: '+p.pack+'</span></div>';
    us.forEach(function(u){
      var k=keyOf(pid,u), v=it.alloc[k]||0, total=allocated(k,E.list), cartQ=S.cart[k]||0;
      var av=Math.max(0,cartQ-total), extra=total-cartQ;
      var raised = v > ((it.committed && it.committed.alloc[k]) || 0);
      var note='';
      if(extra>0) note = raised
        ? '<div class="avail-note" data-extra="'+k+'">Exceeds cart by '+extra+' '+u+' · cart will be increased to '+total+' '+u+' on Save</div>'
        : '<div class="avail-note over" data-over="'+k+'">Overallocated: '+extra+' '+u+' more than the cart ('+cartQ+' '+u+')</div>';
      h+='<div class="uom-box"><span class="ul">UOM ('+u+')</span>'+stepper('alloc',k,v,0,MAX_QTY,i)+'</div>'+
         '<div class="avail'+(av?'':' zero')+'" data-avail="'+k+'">Available <b>('+av+')</b> product in order</div>'+note;
    });
    h+='</div>';
  });
  var saved=!unsaved;
  h+='<div class="save-wrap"><button class="btn-outline" data-act="saveSched" data-idx="'+i+'"'+(saved?' disabled':'')+'>'+(saved?I.check+'Saved':'Save')+'</button></div></div>';
  return h;
}

/* ---------- Category -> Results (product list) ---------- */
function resultItems(){
  var q=(UI.q||'').trim().toLowerCase();
  return CATALOG.filter(function(pid){
    var p=PRODUCTS[pid];
    if(UI.filter==='halal' && !p.halal) return false;
    if(UI.filter==='promo' && !p.promo) return false;
    return !q || (p.name+' '+p.brand+' '+p.sku).toLowerCase().indexOf(q)>=0;
  });
}
function resultCard(pid){
  var p=PRODUCTS[pid], us=Object.keys(p.uoms);
  var cells=us.map(function(u){ var pu=p.uoms[u];
    return '<div>'+u+': <b>'+money(pu.price)+'</b>'+(pu.list?' <s>'+money(pu.list)+'</s>':'')+'</div>'; });
  if(cells.length===1) cells.push('<div></div>');
  var inCart=us.filter(function(u){ return S.cart[keyOf(pid,u)]>0; }).map(function(u){ return S.cart[keyOf(pid,u)]+' '+u; });
  return '<div class="rcard" data-rpid="'+pid+'"><div class="rhead">'+productImg(p)+
    '<div class="pinfo"><div class="pname">'+p.name+'</div><div class="pbrand">Brand: '+p.brand+'</div>'+
      (p.halal?'<span class="halal">'+I.halal+'Halal</span>':'')+'</div>'+
    '<button class="radd" data-act="openAdd" data-pid="'+pid+'" aria-label="Add to cart">'+I.plusBig+'</button></div>'+
    '<div class="rpack">'+I.box+'<span>Pack Size: '+p.pack+'</span></div>'+
    '<div class="rprice">'+cells.join('')+'</div>'+
    (inCart.length?'<div class="incart" data-incart="'+pid+'">In cart: '+inCart.join(', ')+'</div>':'')+'</div>';
}
function resultList(){
  var items=resultItems();
  return items.length ? items.map(resultCard).join('') : '<div class="r-empty">No products found</div>';
}
function renderResults(){
  return '<div class="screen" data-screen="results"><div class="top">'+
    '<div class="appbar"><button class="back" data-act="resultsBack" aria-label="Back">'+I.chevL+'</button><h1>Results</h1></div>'+
    '<div class="search-row"><label class="search">'+I.search+
      '<input id="searchInput" type="search" autocomplete="off" placeholder="Search Product Name or SKU #" value="'+esc(UI.q)+'"></label>'+
      '<button class="filter-btn" data-act="filter" aria-label="Filter">'+I.funnel+(UI.filter!=='all'?'<span class="dot"></span>':'')+'</button></div></div>'+
    '<div class="scroll" id="resultList">'+resultList()+'</div>'+
    navBar('category')+'</div>';
}
function openAddSheet(pid){
  var qty={}; Object.keys(PRODUCTS[pid].uoms).forEach(function(u,i){ qty[keyOf(pid,u)] = i===0 ? 1 : 0; });
  UI.ov={ kind:'add', pid:pid, qty:qty }; renderOverlay();
}
function renderAddSheet(o){
  var p=PRODUCTS[o.pid], sum=0;
  var rows=Object.keys(p.uoms).map(function(u){
    var k=keyOf(o.pid,u), pu=p.uoms[u], q=o.qty[k]||0, c=S.cart[k]||0; sum+=q;
    return '<div class="as-row"><div><div class="l1">UOM ('+u+')</div><div class="l2">'+money(pu.price)+(pu.list?' <s>'+money(pu.list)+'</s>':'')+'</div>'+
      (c?'<div class="l3">In cart: '+c+' '+u+'</div>':'')+'</div>'+stepper('add',k,q,0,MAX_QTY)+'</div>';
  }).join('');
  return '<div class="ov sheet"><div class="ov-bg" data-act="ovClose"></div><div class="sheet-box add-sheet" role="dialog" aria-modal="true"><div class="sheet-grip"></div>'+
    '<div class="as-head">'+productImg(p)+'<div class="pinfo"><div class="pname">'+p.name+'</div><div class="pbrand">Brand: '+p.brand+'</div>'+
      '<div class="as-pack">Pack Size: '+p.pack+'</div></div></div>'+rows+
    '<div class="as-foot"><button class="btn-primary" data-act="addToCart"'+(sum?'':' disabled')+'>Add to Cart</button></div></div></div>';
}
function addToCart(){
  var o=UI.ov, p=PRODUCTS[o.pid], added=[];
  Object.keys(o.qty).forEach(function(k){
    var q=o.qty[k]||0; if(!q) return;
    S.cart[k]=Math.min(MAX_QTY,(S.cart[k]||0)+q); added.push(q+' '+k.split(':')[1]);
  });
  if(!added.length) return;
  persist(); closeOv(); render(); bumpBadge();
  toast('Added '+added.join(', ')+' '+p.name+' to cart','success');
}

function render(){
  var app=$('#app'), sc=app.querySelector('.scroll');
  if(sc && UI.rendered) scrollMem[UI.rendered]=sc.scrollTop;
  syncOrder();
  if(UI.screen==='schedule' && !E) UI.screen='cart';
  if(UI.screen==='confirm' && (S.draftOrderId==null || !Object.keys(S.cart).length)) UI.screen='cart';
  app.innerHTML = UI.screen==='cart' ? renderCart() : UI.screen==='schedule' ? renderSchedule() : UI.screen==='results' ? renderResults() : renderConfirm();
  var sc2=app.querySelector('.scroll');
  if(sc2) sc2.scrollTop = scrollMem[UI.screen]||0;
  UI.rendered=UI.screen;
  renderOverlay();
}
function go(screen){
  hideToast();
  var sc=$('#app .scroll'); if(sc && UI.rendered) scrollMem[UI.rendered]=sc.scrollTop;
  if(screen!=='cart') scrollMem[screen]=0;
  UI.rendered=null; UI.screen=screen; render();
}

/* ---------- Overlays ---------- */
function dialog(title, body, actions, dismissible){
  hideToast();
  UI.ov={ kind:'dialog', title:title, body:body, actions:actions, dismissible:dismissible!==false }; renderOverlay();
}
function sheet(title, options){ UI.ov={ kind:'sheet', title:title, options:options }; renderOverlay(); }
function closeOv(){ UI.ov=null; renderOverlay(); }
function renderOverlay(){
  var ov=$('#ov'), o=UI.ov;
  if(!o){ ov.innerHTML=''; UI.ovShown=null; return; }
  var same = UI.ovShown===o;   // re-render of the overlay already on screen: no enter animation
  UI.ovShown=o;
  ov.className = same ? 'still' : '';
  if(o.kind==='dialog'){
    ov.innerHTML='<div class="ov"><div class="ov-bg" data-act="'+(o.dismissible?'ovClose':'noop')+'"></div><div class="dialog" role="dialog" aria-modal="true">'+
      '<div class="dlg-t">'+o.title+'</div><div class="dlg-b">'+o.body+'</div><div class="dlg-a">'+
      o.actions.map(function(a,i){ return '<button class="dbtn '+(a.kind||'ghost')+'" data-act="dlg" data-i="'+i+'">'+a.label+'</button>'; }).join('')+
      '</div></div></div>';
  } else if(o.kind==='sheet'){
    ov.innerHTML='<div class="ov sheet"><div class="ov-bg" data-act="ovClose"></div><div class="sheet-box" role="dialog" aria-modal="true"><div class="sheet-grip"></div><div class="sheet-t">'+o.title+'</div>'+
      o.options.map(function(op,i){
        return '<button class="sheet-opt'+(op.selected?' sel':'')+'" data-act="sheetOpt" data-i="'+i+'"><span>'+op.label+(op.sub?'<span class="s">'+op.sub+'</span>':'')+'</span>'+(op.selected?I.check:'')+'</button>';
      }).join('')+'</div></div>';
  } else if(o.kind==='cal'){
    ov.innerHTML='<div class="ov"><div class="ov-bg" data-act="ovClose"></div>'+renderCal(o)+'</div>';
  } else if(o.kind==='add'){
    ov.innerHTML=renderAddSheet(o);
  }
}
function openCal(i){
  var it=E.list[i], min=addDays(today(),1), base=it.date?parseIso(it.date):min;
  UI.ov={ kind:'cal', idx:i, sel:it.date, view:new Date(base.getFullYear(),base.getMonth(),1) };
  renderOverlay();
}
function renderCal(o){
  var min=addDays(today(),1), v=o.view, y=v.getFullYear(), m=v.getMonth();
  var title = o.sel ? parseIso(o.sel).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}) : 'Choose Date';
  var canPrev = (y*12+m) > (min.getFullYear()*12+min.getMonth());
  var first=new Date(y,m,1).getDay(), days=new Date(y,m+1,0).getDate(), tIso=iso(today());
  var g=['S','M','T','W','T','F','S'].map(function(w){ return '<div class="wd">'+w+'</div>'; }).join('');
  for(var b=0;b<first;b++) g+='<div></div>';
  for(var d=1; d<=days; d++){
    var dt=new Date(y,m,d), di=iso(dt);
    g+='<button class="day'+(di===o.sel?' sel':'')+(di===tIso?' today':'')+'" data-act="calDay" data-date="'+di+'"'+(dt<min?' disabled':'')+'>'+d+'</button>';
  }
  return '<div class="cal" role="dialog" aria-modal="true"><div class="cal-h"><small>Select date</small><div>'+title+'</div></div>'+
    '<div class="cal-nav"><button data-act="calPrev"'+(canPrev?'':' disabled')+' aria-label="Previous month">'+I.chevL+'</button>'+
    '<b>'+v.toLocaleDateString('en-US',{month:'long',year:'numeric'})+'</b>'+
    '<button data-act="calNext" aria-label="Next month">'+I.chevR+'</button></div>'+
    '<div class="cal-grid">'+g+'</div>'+
    '<div class="cal-act"><button class="txt-btn" data-act="ovClose">CANCEL</button><button class="txt-btn" data-act="calOk"'+(o.sel?'':' disabled')+'>OK</button></div></div>';
}

/* ---------- Feedback ---------- */
function toast(msg, type){
  var t=$('#toast'); t.textContent=msg; t.className='toast show'+(type?' '+type:'');
  clearTimeout(toast._t); toast._t=setTimeout(function(){ t.className='toast'; },1900);
}
function hideToast(){ clearTimeout(toast._t); $('#toast').className='toast'; }
function loading(ms, text){
  var l=$('#loading'); $('#loadingText').textContent=text||'Loading...'; l.classList.add('show');
  return new Promise(function(res){ setTimeout(function(){ l.classList.remove('show'); res(); }, ms); });
}
function bumpBadge(){ var b=$('#cartBadge'); if(b){ b.classList.remove('bump'); void b.offsetWidth; b.classList.add('bump'); } }

/* ---------- Events ---------- */
var phone=$('#phone');
phone.addEventListener('click', function(e){
  var el=e.target.closest('[data-act]');
  if(!el || el.disabled) return;
  var a=el.dataset.act, idx=el.dataset.idx!=null?+el.dataset.idx:null, k=el.dataset.key;
  switch(a){
    case 'cartStep': setCartQty(k, S.cart[k]+(+el.dataset.d)); break;
    case 'delProd': {
      var pid=el.dataset.pid;
      if(productKeys(pid).some(function(x){ return allocated(x)>0; })){
        dialog('Cannot Remove Item','This item is currently assigned to a delivery schedule.<br><br>Please remove it from the delivery schedule first.',[
          { label:'Confirm', kind:'danger' }
        ]);
        break;
      }
      dialog('Remove Item','Are you sure you want to remove '+PRODUCTS[pid].name+' from your cart?',[
        { label:'Remove', kind:'danger', fn:function(){
            productKeys(pid).forEach(function(x){ delete S.cart[x]; });
            cleanupSchedules(); persist(); render(); bumpBadge(); toast('Item removed from cart');
        } },
        { label:'Cancel' }
      ]);
      break;
    }
    case 'addDelivery': loading(600,'Loading...').then(function(){ openEditor(-1,true); }); break;
    case 'openSched': openEditor(idx,false); break;
    case 'checkout': checkout(); break;
    case 'restoreCart':
      S.cart=Object.assign({},INITIAL_CART); S.order=INITIAL_ORDER.slice(); S.schedules=[]; S.incoterm=DEFAULT_INCOTERM; S.draftOrderId=null;
      persist(); render(); bumpBadge(); toast('Đã khôi phục giỏ hàng demo','success'); break;
    case 'nav': {
      var tab=el.dataset.tab;
      if(tab==='cart'){ if(UI.screen!=='cart'){ go('cart'); } break; }
      if(tab==='category'){ if(UI.screen!=='results'){ UI.prev=UI.screen; go('results'); } break; }
      if(tab==='profile'){
        sheet('Demo controls',[
          { label:'Đặt lại toàn bộ dữ liệu demo', sub:'Giỏ hàng ban đầu, xoá lịch giao, Order ID về 2677', fn:function(){
              S=fresh(); E=null; persist(); go('cart'); bumpBadge(); toast('Đã đặt lại dữ liệu demo','success');
          } }
        ]);
        break;
      }
      toast('Bản demo này chỉ mô phỏng luồng Cart & Delivery Schedule'); break;
    }
    /* editor */
    case 'back': editorBack(); break;
    case 'done': E=null; go('cart'); break;
    case 'pickIncoterm':
      sheet('Incoterm', INCOTERMS.map(function(v){ return { label:v, selected:v===E.incoterm, fn:function(){ changeIncoterm(v); } }; }));
      break;
    case 'toggleAcc': E.expanded = E.expanded===idx ? -1 : idx; render(); break;
    case 'pickAddr': {
      var it=E.list[idx];
      sheet('Select Address', ADDR[E.incoterm].map(function(ad,j){
        return { label:esc(ad.name), sub:esc(ad.addr), selected:j===it.addressIdx, fn:function(){ if(it.addressIdx!==j){ it.addressIdx=j; it.dirty=true; render(); } } };
      }));
      break;
    }
    case 'pickDate': openCal(idx); break;
    case 'allocStep': setAlloc(idx, k, (E.list[idx].alloc[k]||0)+(+el.dataset.d)); break;
    case 'resetAlloc': {
      var it2=E.list[idx], p=el.dataset.pid, changed=false;
      Object.keys(PRODUCTS[p].uoms).forEach(function(u){ var kk=keyOf(p,u); if(it2.alloc[kk]){ it2.alloc[kk]=0; changed=true; } });
      if(changed){ it2.dirty=true; render(); }
      break;
    }
    case 'saveSched': saveSched(idx); break;
    case 'delSched': {
      var di = E.expanded>=0 ? E.expanded : E.list.length-1;
      dialog('Delete '+ordinal(di+1)+' Schedule?','This delivery schedule and its allocated quantities will be removed.',[
        { label:'Delete', kind:'danger', fn:function(){
            E.list.splice(di,1); commitEditor([]);
            E.expanded = E.list.length ? Math.min(di,E.list.length-1) : -1;
            render(); toast('Delivery schedule deleted');
        } },
        { label:'Cancel' }
      ]);
      break;
    }
    case 'addSched': {
      E.list.push(newDraft()); E.expanded=E.list.length-1; render();
      var head=$('.acc-head[data-idx="'+E.expanded+'"]'); if(head) head.scrollIntoView({block:'start'});
      break;
    }
    /* results */
    case 'resultsBack': go(UI.prev && UI.prev!=='results' ? UI.prev : 'cart'); break;
    case 'filter': {
      var opts=[['all','All Products'],['halal','Halal'],['promo','Promotion']];
      sheet('Filter', opts.map(function(f){ return { label:f[1], selected:UI.filter===f[0], fn:function(){ UI.filter=f[0]; scrollMem.results=0; render(); } }; }));
      break;
    }
    case 'openAdd': openAddSheet(el.dataset.pid); break;
    case 'addStep': UI.ov.qty[k]=Math.max(0,Math.min(MAX_QTY,(UI.ov.qty[k]||0)+(+el.dataset.d))); renderOverlay(); break;
    case 'addToCart': addToCart(); break;
    /* confirm */
    case 'confirmBack': go('cart'); break;
    case 'submit': submitOrder(); break;
    /* overlays */
    case 'ovClose': closeOv(); break;
    case 'dlg': { var act=UI.ov.actions[+el.dataset.i]; closeOv(); if(act.fn) act.fn(); break; }
    case 'sheetOpt': { var op=UI.ov.options[+el.dataset.i]; closeOv(); if(op.fn) op.fn(); break; }
    case 'calPrev': UI.ov.view=new Date(UI.ov.view.getFullYear(),UI.ov.view.getMonth()-1,1); renderOverlay(); break;
    case 'calNext': UI.ov.view=new Date(UI.ov.view.getFullYear(),UI.ov.view.getMonth()+1,1); renderOverlay(); break;
    case 'calDay': UI.ov.sel=el.dataset.date; renderOverlay(); break;
    case 'calOk': {
      var c=UI.ov, t=E.list[c.idx];
      if(t.date!==c.sel){ t.date=c.sel; t.dirty=true; }
      t.err=null; closeOv(); render(); break;
    }
  }
});
phone.addEventListener('change', function(e){
  var el=e.target; if(!el.dataset || !el.dataset.input) return;
  var kind=el.dataset.input; if(kind==='instr') return;
  var v=parseInt(String(el.value).replace(/\D/g,''),10);
  if(kind==='cart'){ if(isNaN(v)||v<1){ toast('Quantity must be at least 1'); render(); return; } setCartQty(el.dataset.key, v); }
  else if(kind==='alloc'){ setAlloc(+el.dataset.idx, el.dataset.key, isNaN(v)?0:v); }
  else if(kind==='add' && UI.ov && UI.ov.kind==='add'){ UI.ov.qty[el.dataset.key]=isNaN(v)?0:Math.min(MAX_QTY,v); renderOverlay(); }
});
phone.addEventListener('input', function(e){
  var el=e.target;
  if(el.id==='searchInput'){
    UI.q=el.value; var list=$('#resultList'); if(list){ list.innerHTML=resultList(); list.scrollTop=0; }
    return;
  }
  if(el.dataset && el.dataset.input==='instr' && E){
    var i=+el.dataset.idx; E.list[i].instruction=el.value; E.list[i].dirty=true; refreshEditorButtons(i);
  }
});
phone.addEventListener('keydown', function(e){
  if(e.key==='Enter' && e.target.classList && e.target.classList.contains('st-input')){ e.preventDefault(); e.target.blur(); }
  if(e.key==='Escape' && UI.ov && !(UI.ov.kind==='dialog' && !UI.ov.dismissible)) closeOv();
});
phone.addEventListener('focusin', function(e){
  if(e.target.classList && e.target.classList.contains('st-input')) setTimeout(function(){ try{ e.target.select(); }catch(x){} },0);
});

render();
})();
</script>
</body>
</html>
